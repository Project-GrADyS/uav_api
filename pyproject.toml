[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uav_api*"]

[project]
name = "uav_api"
version = "0.2.2"
description = "Uav_api is a python package that provides a HTTP interface for MAVLink commands for ardupilot vehicles"
keywords = ["mavlink", "http", "simulation", "gradys", "LAC", "PUC", "drone", "ardupilot"]
authors = [
    { name = "Francisco Meirelles Fleury", email = "franmeifleury@gmail.com" }
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

dependencies = [
    'fastapi>=0.115.4',
    'MAVProxy>=1.8.71',
    'pydantic>=2.9.2',
    'pymavlink>=2.4.41',
    'uvicorn>=0.32.0',
    'hypercorn[h3]>=0.17.0',
    'cryptography>=41.0.0',
    'future>=1.0.0',
    'pexpect>=4.9.0',
    'aiohttp>=3.9.0',
    'psutil>=5.9.0',
    'python-multipart>=0.0.6'
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0',
    'requests>=2.31',
    'httpx>=0.27',
    'psutil>=5.9.0',
    'ruff>=0.6',
]

[project.urls]
"Homepage" = "https://github.com/Project-GrADyS/uav_api"

[project.scripts]
uav-api = "uav_api.run_api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "sitl: integration test that spawns ArduPilot SITL; requires sim_vehicle.py, tmux and a local environment. Deselect with -m 'not sitl'.",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]